<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Volleyball Malawi — Courts & Clubs Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green: #1a7a4a;
    --green-light: #e8f5ee;
    --green-mid: #2ea866;
    --red: #ce2028;
    --black: #0f0f0f;
    --white: #fafaf8;
    --gray: #f2f0eb;
    --gray-mid: #d8d5cc;
    --text-muted: #7a7870;
    --sidebar-w: 300px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--white);
    color: var(--black);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 58px;
    background: var(--black);
    color: var(--white);
    flex-shrink: 0;
    z-index: 1000;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo img {
    height: 38px;
    width: 38px;
    object-fit: contain;
    border-radius: 4px;
  }

  .logo-text h1 {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--white);
    line-height: 1.1;
  }

  .logo-text p {
    font-size: 10px;
    opacity: 0.4;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .stat { text-align: right; }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    color: var(--green-mid);
  }
  .stat-label { font-size: 10px; opacity: 0.4; text-transform: uppercase; letter-spacing: 0.8px; }

  .header-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.15); }

  .submit-btn {
    background: var(--green);
    color: var(--white);
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .submit-btn:hover { background: var(--green-mid); }

  .main { display: flex; flex: 1; overflow: hidden; }

  sidebar {
    display: flex;
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--white);
    border-right: 1px solid var(--gray-mid);
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
  }

  .search-area { padding: 14px 16px 10px; border-bottom: 1px solid var(--gray); }

  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1px solid var(--gray-mid);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--gray);
    color: var(--black);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--green); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.35; font-size: 15px; }

  .filters { display: flex; padding: 10px 16px; gap: 6px; border-bottom: 1px solid var(--gray); }
  .filter-btn {
    flex: 1;
    padding: 7px 0;
    border: 1px solid var(--gray-mid);
    border-radius: 6px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .filter-btn.active { background: var(--black); border-color: var(--black); color: var(--white); }
  .filter-dot { width: 7px; height: 7px; border-radius: 50%; }

  .list-header { padding: 10px 16px 6px; font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px; }

  .list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--gray-mid) transparent; }

  .list-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--gray);
    cursor: pointer;
    transition: background 0.1s;
  }
  .list-item:hover { background: var(--gray); }
  .list-item.active { background: var(--green-light); border-left: 3px solid var(--green); }

  .item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .item-name { font-size: 13px; font-weight: 500; color: var(--black); line-height: 1.3; }
  .item-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .badge-court { background: #e8f5ee; color: #1a7a4a; }
  .badge-club  { background: #fff3e0; color: #e65100; }
  .badge-both  { background: #f3e5f5; color: #6a1b9a; }
  .item-city { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  /* Loading / status states */
  .status-msg {
    padding: 30px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .status-msg .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid var(--gray-mid);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Pending badge for unverified submissions */
  .badge-pending { background: #fff8e1; color: #f57f17; font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 999px; }

  .map-area { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  .detail-card {
    position: absolute;
    bottom: 20px; right: 20px;
    width: 270px;
    background: var(--white);
    border-radius: 12px;
    border: 1px solid var(--gray-mid);
    padding: 16px;
    z-index: 999;
    display: none;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .detail-card.visible { display: block; }

  .detail-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .detail-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--black); line-height: 1.2; flex: 1; margin-right: 8px; }
  .detail-close { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--text-muted); line-height: 1; padding: 0; }
  .detail-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .detail-info { font-size: 13px; color: var(--black); line-height: 1.6; border-top: 1px solid var(--gray); padding-top: 10px; margin-top: 4px; }
  .detail-contact { margin-top: 8px; font-size: 12px; color: var(--green); font-weight: 500; }

  .fab {
    position: absolute;
    bottom: 20px; left: 20px;
    background: var(--black);
    color: var(--white);
    border: none;
    padding: 12px 18px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    transition: transform 0.15s;
    text-decoration: none;
  }
  .fab:hover { transform: translateY(-2px); }

  @media (max-width: 640px) {
    :root { --sidebar-w: 100%; }
    .main { flex-direction: column; }
    sidebar { width: 100%; min-width: 100%; max-height: 45vh; }
    .header-right .stat, .header-divider { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <!-- VBMW Logo: replace the src below with your actual hosted logo URL -->
    <img src="https://volleyballmalawi.github.io/Volleyball-malawi/logo.png" alt="VBMW Logo"
         onerror="this.style.display='none'"/>
    <div class="logo-text">
      <h1>Volleyball Malawi</h1>
      <p>Courts &amp; Clubs Map</p>
    </div>
  </div>
  <div class="header-right">
    <div class="stat">
      <div class="stat-num" id="hdr-courts">—</div>
      <div class="stat-label">Courts</div>
    </div>
    <div class="header-divider"></div>
    <div class="stat">
      <div class="stat-num" id="hdr-clubs">—</div>
      <div class="stat-label">Clubs</div>
    </div>
    <div class="header-divider"></div>
    <!-- IMPORTANT: Replace the href below with your actual Google Form link -->
    <a class="submit-btn" href="YOUR_GOOGLE_FORM_LINK_HERE" target="_blank">
      + Submit a location
    </a>
  </div>
</header>

<div class="main">
  <sidebar>
    <div class="search-area">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search" placeholder="Search courts and clubs…" oninput="renderList()"/>
      </div>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">
        <span class="filter-dot" style="background:#555;"></span> All
      </button>
      <button class="filter-btn" onclick="setFilter('court', this)">
        <span class="filter-dot" style="background:#1a7a4a;"></span> Courts
      </button>
      <button class="filter-btn" onclick="setFilter('club', this)">
        <span class="filter-dot" style="background:#e65100;"></span> Clubs
      </button>
    </div>
    <div class="list-header" id="list-count">Loading…</div>
    <div class="list" id="list">
      <div class="status-msg"><div class="spinner"></div><br>Loading locations…</div>
    </div>
  </sidebar>

  <div class="map-area">
    <div id="map"></div>

    <div class="detail-card" id="detail">
      <div class="detail-top">
        <div class="detail-name" id="d-name"></div>
        <button class="detail-close" onclick="closeDetail()">×</button>
      </div>
      <div class="detail-meta" id="d-meta"></div>
      <div class="detail-info" id="d-info"></div>
      <div class="detail-contact" id="d-contact"></div>
    </div>

    <!-- Replace href with your Google Form link -->
    <a class="fab" href="YOUR_GOOGLE_FORM_LINK_HERE" target="_blank">
      + Add a location
    </a>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

// ── CONFIG ────────────────────────────────────────────────────────────
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRxHg1ptsfa1wfx6J8skasXciJ1tfQ9yNI94EhcW5ermx9yKOOZu7aCIZ5FZnlI3TiANixz182Z4roX/pub?output=csv";

// Seed data — shown while sheet loads, and as fallback if sheet is empty
const SEED = [
  { id:"s1", type:"court", name:"Kamuzu Institute Court", city:"Lilongwe", lat:-13.962, lng:33.787, info:"Outdoor court at the national sports complex. Open daily.", contact:"", source:"seed" },
  { id:"s2", type:"court", name:"Blantyre Sports Club Court", city:"Blantyre", lat:-15.786, lng:35.005, info:"Indoor court. Hosts national league matches.", contact:"", source:"seed" },
  { id:"s3", type:"court", name:"Mzuzu Community Court", city:"Mzuzu", lat:-11.466, lng:34.021, info:"Open-air community court. Free to use on weekends.", contact:"", source:"seed" },
  { id:"s4", type:"court", name:"Zomba UNIMA Court", city:"Zomba", lat:-15.387, lng:35.318, info:"University of Malawi campus court.", contact:"", source:"seed" },
  { id:"s5", type:"club", name:"Lilongwe Spikers VC", city:"Lilongwe", lat:-13.975, lng:33.774, info:"Competitive club. Trains Tue/Thu/Sat. Open tryouts every January.", contact:"", source:"seed" },
  { id:"s6", type:"club", name:"Blantyre Flames VC", city:"Blantyre", lat:-15.800, lng:35.010, info:"Founded 2012. Competes in national league division 1.", contact:"", source:"seed" },
  { id:"s7", type:"club", name:"Mzuzu Eagles VC", city:"Mzuzu", lat:-11.480, lng:34.030, info:"Northern region champions 2023. Youth programme available.", contact:"", source:"seed" },
  { id:"s8", type:"club", name:"Salima Beach VC", city:"Salima", lat:-13.784, lng:34.459, info:"Beach volleyball focus. Trains at Lake Malawi shores.", contact:"", source:"seed" }
];

// City coordinates for landmark-only submissions
const CITY_COORDS = {
  "lilongwe":  { lat:-13.966, lng:33.787 },
  "blantyre":  { lat:-15.786, lng:35.005 },
  "mzuzu":     { lat:-11.466, lng:34.021 },
  "zomba":     { lat:-15.387, lng:35.318 },
  "salima":    { lat:-13.784, lng:34.459 },
  "mangochi":  { lat:-14.480, lng:35.264 },
  "kasungu":   { lat:-13.010, lng:33.483 },
  "dedza":     { lat:-14.367, lng:34.333 },
  "karonga":   { lat:-9.933,  lng:33.933 },
  "liwonde":   { lat:-15.067, lng:35.233 }
};

// ── MAP ───────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([-13.25, 34.30], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
  maxZoom: 18
}).addTo(map);

function makeIcon(type, pending) {
  const colors = { court:'#1a7a4a', club:'#e65100', both:'#6a1b9a' };
  const c = pending ? '#bbb' : (colors[type] || '#555');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="38" viewBox="0 0 30 38">
    <path d="M15 0C6.72 0 0 6.72 0 15C0 26.25 15 38 15 38C15 38 30 26.25 30 15C30 6.72 23.28 0 15 0Z" fill="${c}"/>
    <circle cx="15" cy="15" r="8" fill="white" opacity="0.92"/>
    <circle cx="15" cy="15" r="4" fill="${c}" opacity="0.6"/>
  </svg>`;
  return L.divIcon({ html: svg, iconSize:[30,38], iconAnchor:[15,38], popupAnchor:[0,-40], className:'' });
}

// ── STATE ─────────────────────────────────────────────────────────────
let locations = [...SEED];
let activeFilter = 'all';
let activeId = null;
const markers = {};

function addMarker(loc) {
  if (!loc.lat || !loc.lng) return;
  if (markers[loc.id]) { map.removeLayer(markers[loc.id]); }
  const m = L.marker([loc.lat, loc.lng], { icon: makeIcon(loc.type, loc.pending) }).addTo(map);
  m.on('click', () => selectLocation(loc));
  markers[loc.id] = m;
}

SEED.forEach(addMarker);
renderList();

// ── PARSE CSV FROM GOOGLE SHEET ───────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  // Headers: Timestamp, Name, Type, Location, City, Contact, Phone
  const results = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    if (!cols[1]) continue; // skip empty rows
    const name    = cols[1]?.trim() || '';
    const typeRaw = (cols[2]?.trim() || 'court').toLowerCase();
    const locText = cols[3]?.trim() || '';
    const city    = cols[4]?.trim() || '';
    const contact = cols[5]?.trim() || '';
    const phone   = cols[6]?.trim() || '';
    const extra   = '';

    const type = typeRaw.includes('both') ? 'both' : typeRaw.includes('club') ? 'club' : 'court';

    // Try to extract GPS from location text
    let lat = null, lng = null;
    const gpsMatch = locText.match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
    if (gpsMatch) {
      lat = parseFloat(gpsMatch[1]);
      lng = parseFloat(gpsMatch[2]);
    } else {
      // Fall back to city centre
      const cityKey = city.toLowerCase().trim();
      const cityCoord = CITY_COORDS[cityKey];
      if (cityCoord) {
        lat = cityCoord.lat + (Math.random() - 0.5) * 0.02;
        lng = cityCoord.lng + (Math.random() - 0.5) * 0.02;
      }
    }

    results.push({
      id: 'sub_' + i,
      type, name, city,
      lat, lng,
      info: [locText, extra].filter(Boolean).join(' · ') || 'Submitted by community.',
      contact: [contact, phone].filter(Boolean).join(' · '),
      pending: true,
      source: 'sheet'
    });
  }
  return results;
}

function splitCSVLine(line) {
  const result = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(cur); cur = ''; }
    else { cur += ch; }
  }
  result.push(cur);
  return result;
}

// ── FETCH SHEET ───────────────────────────────────────────────────────
async function loadSheet() {
  try {
    const res = await fetch(SHEET_CSV + '&cachebust=' + Date.now());
    const text = await res.text();
    const submissions = parseCSV(text);
    if (submissions.length > 0) {
      // Remove old sheet markers
      locations.filter(l => l.source === 'sheet').forEach(l => {
        if (markers[l.id]) map.removeLayer(markers[l.id]);
      });
      locations = [...SEED, ...submissions];
      submissions.forEach(addMarker);
      renderList();
    }
  } catch(e) {
    console.log('Sheet load error:', e);
  }
}

loadSheet();
setInterval(loadSheet, 60000); // refresh every 60 seconds

// ── RENDER LIST ───────────────────────────────────────────────────────
function renderList() {
  const search = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('list');

  const visible = locations.filter(loc => {
    const matchFilter = activeFilter === 'all' || loc.type === activeFilter;
    const matchSearch = !search ||
      loc.name.toLowerCase().includes(search) ||
      loc.city.toLowerCase().includes(search);
    return matchFilter && matchSearch;
  });

  const courts = locations.filter(l => l.type === 'court' || l.type === 'both').length;
  const clubs  = locations.filter(l => l.type === 'club'  || l.type === 'both').length;
  document.getElementById('hdr-courts').textContent = courts;
  document.getElementById('hdr-clubs').textContent  = clubs;
  document.getElementById('list-count').textContent = `${visible.length} location${visible.length !== 1 ? 's' : ''}`;

  if (visible.length === 0) {
    list.innerHTML = '<div class="status-msg">No locations found.<br>Try a different search.</div>';
    return;
  }

  list.innerHTML = visible.map(loc => `
    <div class="list-item ${loc.id === activeId ? 'active' : ''}"
         onclick='selectLocation(${JSON.stringify(loc).replace(/'/g, "&#39;")})'>
      <div class="item-top">
        <div class="item-name">${loc.name}</div>
        <span class="item-badge badge-${loc.pending ? 'pending' : loc.type}">
          ${loc.pending ? 'submitted' : loc.type}
        </span>
      </div>
      <div class="item-city">📍 ${loc.city || 'Malawi'}</div>
    </div>
  `).join('');

  // Sync marker visibility
  locations.forEach(loc => {
    if (!markers[loc.id]) return;
    const show = activeFilter === 'all' || loc.type === activeFilter;
    if (show) map.addLayer(markers[loc.id]);
    else map.removeLayer(markers[loc.id]);
  });
}

// ── SELECT ────────────────────────────────────────────────────────────
function selectLocation(loc) {
  activeId = loc.id;
  if (loc.lat && loc.lng) {
    map.flyTo([loc.lat, loc.lng], 13, { animate: true, duration: 0.8 });
  }
  const typeLabels = { court:'Volleyball Court', club:'Volleyball Club', both:'Court & Club' };
  document.getElementById('d-name').textContent = loc.name;
  document.getElementById('d-meta').textContent =
    `📍 ${loc.city || 'Malawi'}  ·  ${typeLabels[loc.type] || loc.type}${loc.pending ? '  ·  ⏳ Awaiting verification' : ''}`;
  document.getElementById('d-info').textContent = loc.info || '';
  document.getElementById('d-contact').textContent = loc.contact ? '📞 ' + loc.contact : '';
  document.getElementById('detail').classList.add('visible');
  renderList();
}

function closeDetail() {
  activeId = null;
  document.getElementById('detail').classList.remove('visible');
  renderList();
}

function setFilter(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

</script>
</body>
</html>
