<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Volleyball Malawi — Courts & Clubs Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green: #1a7a4a;
    --green-light: #e8f5ee;
    --green-mid: #2ea866;
    --red: #ce2028;
    --black: #0f0f0f;
    --white: #fafaf8;
    --gray: #f2f0eb;
    --gray-mid: #d8d5cc;
    --text-muted: #7a7870;
    --sidebar-w: 300px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--white);
    color: var(--black);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 58px;
    background: var(--black);
    color: var(--white);
    flex-shrink: 0;
    z-index: 1000;
    position: relative;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-flag {
    display: flex;
    gap: 2px;
    align-items: center;
  }

  .flag-stripe {
    width: 5px;
    height: 22px;
    border-radius: 1px;
  }

  .logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--white);
  }

  .logo span {
    font-weight: 400;
    opacity: 0.5;
  }

  .header-stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .stat {
    text-align: right;
  }

  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    color: var(--green-mid);
  }

  .stat-label {
    font-size: 10px;
    opacity: 0.4;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .header-divider {
    width: 1px;
    height: 28px;
    background: rgba(255,255,255,0.15);
  }

  .submit-btn {
    background: var(--green);
    color: var(--white);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .submit-btn:hover { background: var(--green-mid); }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  sidebar {
    display: block;
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--white);
    border-right: 1px solid var(--gray-mid);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
  }

  .search-area {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--gray);
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1px solid var(--gray-mid);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--gray);
    color: var(--black);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-wrap input:focus { border-color: var(--green); }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.35;
    font-size: 15px;
  }

  /* Filter tabs */
  .filters {
    display: flex;
    padding: 10px 16px;
    gap: 6px;
    border-bottom: 1px solid var(--gray);
  }

  .filter-btn {
    flex: 1;
    padding: 7px 0;
    border: 1px solid var(--gray-mid);
    border-radius: 6px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .filter-btn.active {
    background: var(--black);
    border-color: var(--black);
    color: var(--white);
  }

  .filter-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  /* List */
  .list-header {
    padding: 10px 16px 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }

  .list {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--gray-mid) transparent;
  }

  .list-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--gray);
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }

  .list-item:hover { background: var(--gray); }
  .list-item.active { background: var(--green-light); border-left: 3px solid var(--green); }

  .item-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .item-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--black);
    line-height: 1.3;
  }

  .item-badge {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge-court { background: #e8f5ee; color: #1a7a4a; }
  .badge-club  { background: #fff3e0; color: #e65100; }
  .badge-beach { background: #e3f2fd; color: #1565c0; }

  .item-city {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* Map area */
  .map-area {
    flex: 1;
    position: relative;
  }

  #map { width: 100%; height: 100%; }

  /* Detail card */
  .detail-card {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 260px;
    background: var(--white);
    border-radius: 12px;
    border: 1px solid var(--gray-mid);
    padding: 16px;
    z-index: 999;
    display: none;
    animation: slideUp 0.2s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .detail-card.visible { display: block; }

  .detail-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .detail-name {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--black);
    line-height: 1.2;
    flex: 1;
    margin-right: 8px;
  }

  .detail-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-muted);
    line-height: 1;
    padding: 0;
  }

  .detail-city {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .detail-info {
    font-size: 13px;
    color: var(--black);
    line-height: 1.6;
    border-top: 1px solid var(--gray);
    padding-top: 10px;
  }

  /* Map attribution override */
  .leaflet-control-attribution { font-size: 10px; }

  /* Floating add button (mobile) */
  .fab {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: var(--black);
    color: var(--white);
    border: none;
    padding: 12px 18px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    transition: transform 0.15s;
    text-decoration: none;
  }

  .fab:hover { transform: translateY(-2px); }

  /* Responsive */
  @media (max-width: 640px) {
    :root { --sidebar-w: 100%; }
    .main { flex-direction: column; }
    sidebar { width: 100%; min-width: 100%; max-height: 45vh; }
    .header-stats { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-flag">
      <div class="flag-stripe" style="background:#000;"></div>
      <div class="flag-stripe" style="background:#ce2028;"></div>
      <div class="flag-stripe" style="background:#339e35;"></div>
    </div>
    <h1>Volleyball <span>/</span> Malawi</h1>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-num" id="hdr-courts">4</div>
      <div class="stat-label">Courts</div>
    </div>
    <div class="header-divider"></div>
    <div class="stat">
      <div class="stat-num" id="hdr-clubs">4</div>
      <div class="stat-label">Clubs</div>
    </div>
    <div class="header-divider"></div>
    <a class="submit-btn" href="#" onclick="alert('Submission form coming soon! Check back shortly.')">
      + Submit a location
    </a>
  </div>
</header>

<div class="main">
  <sidebar>
    <div class="search-area">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search" placeholder="Search courts and clubs…" oninput="filterList()"/>
      </div>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">
        <span class="filter-dot" style="background:#555;"></span> All
      </button>
      <button class="filter-btn" onclick="setFilter('court', this)">
        <span class="filter-dot" style="background:#1a7a4a;"></span> Courts
      </button>
      <button class="filter-btn" onclick="setFilter('club', this)">
        <span class="filter-dot" style="background:#e65100;"></span> Clubs
      </button>
    </div>
    <div class="list-header" id="list-count">8 locations</div>
    <div class="list" id="list"></div>
  </sidebar>

  <div class="map-area">
    <div id="map"></div>

    <div class="detail-card" id="detail">
      <div class="detail-top">
        <div class="detail-name" id="d-name"></div>
        <button class="detail-close" onclick="closeDetail()">×</button>
      </div>
      <div class="detail-city" id="d-city"></div>
      <div class="detail-info" id="d-info"></div>
    </div>

    <a class="fab" href="#" onclick="alert('Submission form coming soon!'); return false;">
      + Add a location
    </a>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── DATA ──────────────────────────────────────────────────────────────
// To add a new location, copy one of the objects below and fill in the details.
// lat/lng = coordinates (find them on Google Maps — right click any location)
const locations = [
  {
    id: 1, type: "court",
    name: "Kamuzu Institute Court",
    city: "Lilongwe",
    lat: -13.962, lng: 33.787,
    info: "Outdoor court at the national sports complex. Open daily to the public."
  },
  {
    id: 2, type: "court",
    name: "Blantyre Sports Club Court",
    city: "Blantyre",
    lat: -15.786, lng: 35.005,
    info: "Indoor court. Hosts national league matches. Contact club for access."
  },
  {
    id: 3, type: "court",
    name: "Mzuzu Community Court",
    city: "Mzuzu",
    lat: -11.466, lng: 34.021,
    info: "Open-air community court. Free to use on weekends."
  },
  {
    id: 4, type: "court",
    name: "Zomba UNIMA Court",
    city: "Zomba",
    lat: -15.387, lng: 35.318,
    info: "University of Malawi campus court. Priority given to students."
  },
  {
    id: 5, type: "club",
    name: "Lilongwe Spikers VC",
    city: "Lilongwe",
    lat: -13.975, lng: 33.774,
    info: "Competitive club. Trains Tue/Thu/Sat. Open tryouts every January."
  },
  {
    id: 6, type: "club",
    name: "Blantyre Flames VC",
    city: "Blantyre",
    lat: -15.800, lng: 35.010,
    info: "Founded 2012. Competes in national league division 1."
  },
  {
    id: 7, type: "club",
    name: "Mzuzu Eagles VC",
    city: "Mzuzu",
    lat: -11.480, lng: 34.030,
    info: "Northern region champions 2023. Youth programme available."
  },
  {
    id: 8, type: "club",
    name: "Salima Beach VC",
    city: "Salima",
    lat: -13.784, lng: 34.459,
    info: "Beach volleyball focus. Trains at Lake Malawi shores. All welcome."
  }
];

// ── MAP SETUP ─────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([-13.25, 34.30], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
  maxZoom: 18
}).addTo(map);

// ── ICONS ─────────────────────────────────────────────────────────────
function makeIcon(type) {
  const colors = { court: '#1a7a4a', club: '#e65100', beach: '#1565c0' };
  const c = colors[type] || '#555';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="38" viewBox="0 0 30 38">
    <path d="M15 0C6.72 0 0 6.72 0 15C0 26.25 15 38 15 38C15 38 30 26.25 30 15C30 6.72 23.28 0 15 0Z" fill="${c}"/>
    <circle cx="15" cy="15" r="8" fill="white" opacity="0.92"/>
    <circle cx="15" cy="15" r="4" fill="${c}" opacity="0.6"/>
  </svg>`;
  return L.divIcon({ html: svg, iconSize: [30, 38], iconAnchor: [15, 38], popupAnchor: [0, -40], className: '' });
}

// ── STATE ──────────────────────────────────────────────────────────────
let activeFilter = 'all';
let activeId = null;
const markers = {};

// ── RENDER MARKERS ────────────────────────────────────────────────────
locations.forEach(loc => {
  const m = L.marker([loc.lat, loc.lng], { icon: makeIcon(loc.type) }).addTo(map);
  m.on('click', () => selectLocation(loc));
  markers[loc.id] = m;
});

// ── RENDER SIDEBAR LIST ───────────────────────────────────────────────
function renderList() {
  const search = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('list');
  const visible = locations.filter(loc => {
    const matchFilter = activeFilter === 'all' || loc.type === activeFilter;
    const matchSearch = loc.name.toLowerCase().includes(search) || loc.city.toLowerCase().includes(search);
    return matchFilter && matchSearch;
  });

  document.getElementById('list-count').textContent = `${visible.length} location${visible.length !== 1 ? 's' : ''}`;

  if (visible.length === 0) {
    list.innerHTML = '<div class="empty-state">No locations found.<br>Try a different search.</div>';
    return;
  }

  list.innerHTML = visible.map(loc => `
    <div class="list-item ${loc.id === activeId ? 'active' : ''}" onclick="selectLocation(${JSON.stringify(loc).replace(/"/g, '&quot;')})">
      <div class="item-top">
        <div class="item-name">${loc.name}</div>
        <span class="item-badge badge-${loc.type}">${loc.type}</span>
      </div>
      <div class="item-city">📍 ${loc.city}</div>
    </div>
  `).join('');

  // Update header counts
  document.getElementById('hdr-courts').textContent = locations.filter(l => l.type === 'court').length;
  document.getElementById('hdr-clubs').textContent  = locations.filter(l => l.type === 'club').length;

  // Show/hide markers
  locations.forEach(loc => {
    const isVisible = activeFilter === 'all' || loc.type === activeFilter;
    if (isVisible) map.addLayer(markers[loc.id]);
    else map.removeLayer(markers[loc.id]);
  });
}

// ── SELECT A LOCATION ─────────────────────────────────────────────────
function selectLocation(loc) {
  activeId = loc.id;
  map.flyTo([loc.lat, loc.lng], 12, { animate: true, duration: 0.8 });

  const labels = { court: 'Volleyball Court', club: 'Volleyball Club', beach: 'Beach Volleyball' };
  document.getElementById('d-name').textContent = loc.name;
  document.getElementById('d-city').textContent = `📍 ${loc.city}  ·  ${labels[loc.type] || loc.type}`;
  document.getElementById('d-info').textContent = loc.info;
  document.getElementById('detail').classList.add('visible');

  renderList();
}

function closeDetail() {
  activeId = null;
  document.getElementById('detail').classList.remove('visible');
  renderList();
}

// ── FILTER ────────────────────────────────────────────────────────────
function setFilter(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function filterList() { renderList(); }

// ── INIT ──────────────────────────────────────────────────────────────
renderList();
</script>
</body>
</html>
